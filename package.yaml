# This YAML file describes your package. Stack will automatically generate a
# Cabal file when you run `stack build`. See the hpack website for help with
# this file: <https://github.com/sol/hpack>.
name: tropical-geometry
version: '0.0.0.1'
github: "ferzcam/tropical-geometry"
license: GPL-3
author: "Fernando Zhapa"
maintainer: "Fernando Zhapa"
# synopsis: A new Haskeleton package.
# description: Tropical is a new Haskeleton package.
# category: Other

extra-source-files:
- CHANGELOG.md
- comparison/*.py
- comparison/*.md
#- LICENSE.md
- package.yaml
- README.md
- stack.yaml
- viewer/README.md
- viewer/*.py
- viewer/*.html
- viewer/*.js
- viewer/*.css
- viewer/package.json
- viewer/package-lock.json
- viewer/tests/*.js
- viewer/examples/*.json
- viewer/vendor/*
- viewer/vendor/three/*

ghc-options: -Wall

library:
  exposed-modules:
  - Polynomial.Monomial
  - Polynomial.Prelude
  - Polynomial.Hypersurface
  - Polynomial.Curve
  - Arithmetic.Numbers
  - Arithmetic.Matrix
  - Geometry.ConvexHull2
  - Geometry.ConvexHull3
  - Geometry.Polytope
  - Geometry.Polyhedral
  - Geometry.Vertex
  - Geometry.Facet
  - Geometry.LRS
  - Geometry.LRSHull
  - Geometry.TropicalCurve
  - Geometry.TropicalHull2
  - Geometry.TropicalSlice
  - Geometry.TropicalSlice4
  - Geometry.TropicalSkeleton3
  - Geometry.TropicalGraph3
  - Geometry.TropicalHull3
  - Graphics.Drawings
  - Util
  - Core

  dependencies:
  - base
  - containers
  - numeric-prelude
  - semiring-simple
  - sized
  - algebra
  - singletons-base
  - type-natural
  - lens
  - matrix
  - gloss
  - vector
  - hmatrix-glpk
  - linear
  source-dirs: library


executables:
  solver-comparison:
    source-dirs: comparison
    main: Main.hs
    other-modules: [Methods, Skeleton3, HullSkeleton3, HistoricalRegression]
    dependencies: [base, tropical-geometry, aeson, bytestring, text, containers, matrix, deepseq, sized]
    ghc-options: [-O2, -rtsopts, -threaded]
  tropical-viewer-geometry:
    source-dirs: executable
    main: ViewerMain.hs
    other-modules: []
    dependencies:
    - base
    - tropical-geometry
    - aeson
    - bytestring
    - text
    ghc-options:
    - -rtsopts
    - -threaded
  tropical-geometry:
    source-dirs: executable
    main: Main.hs
    other-modules: []
    dependencies:
    - base
    - tropical-geometry
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N
    - -freverse-errors
benchmarks:
  tropical-geometry-benchmarks:
    source-dirs: benchmark
    main: Main.hs
    dependencies:
    - base
    - tropical-geometry
    - criterion
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N
    - -freverse-errors
tests:
  tropical-geometry-test-suite:
    source-dirs: test-suite
    main: Main.hs
    dependencies:
    - base
    - tropical-geometry
    - containers
    - tasty
    - tasty-hspec
    - tasty-hunit
    - matrix
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N
    - -freverse-errors
